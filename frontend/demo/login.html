<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>Login — Demo</title><link rel="stylesheet" href="assets/css/demo.css"></head><body>
<div class="bar" style="padding:8px 16px;font-size:12px;background:#0f3460;">
    <span>WS:</span><input id="wsUrlInput" style="width:200px;padding:4px 8px;border:1px solid #333;border-radius:4px;background:#1a1a2e;color:#e0e0e0;font-size:12px;" onchange="DemoConfig.WS_URL=this.value">
    <a href="index.html" style="color:#60a5fa;text-decoration:none;margin-left:auto;">← Back</a>
</div>
<div class="frm" id="loginSection">
<h2>Register / Login</h2>
<label>Username (3-32 a-z 0-9 _)</label><input id="u" placeholder="e.g. new_user">
<label>Password (6-128 chars)</label><input id="p" type="password" placeholder="e.g. 123456">
<div class="err" id="err"></div>
<button onclick="LoginPage.register()">Register</button>
<button onclick="LoginPage.login()" style="background:#7c3aed">Login</button>
<button onclick="LoginPage.logout()" style="background:#dc2626;margin-top:12px">Logout / Clear</button>
<p style="font-size:11px;color:#666;margin-top:8px">Test: user001 / 123456 &nbsp; user002 / 654321</p>
</div>
<div class="lay" style="margin-top:20px">
<div class="main"><div class="bar"><span class="conn-status off" id="st">○ Disconnected</span> <span id="bd">-</span> <span id="tk">No token</span></div><div class="chat" id="chat"></div></div>
<div class="side"><div class="ph">Protocol</div><div class="pl" id="pl"></div></div>
</div>
<script src="assets/js/config.js"></script><script src="assets/js/protocol.js"></script><script src="assets/js/state.js"></script><script src="assets/js/ws-client.js"></script><script src="assets/js/ui.js"></script>
<script src="assets/js/pages/login-page.js"></script>
<script>LoginPage.init();</script>
</body></html>
