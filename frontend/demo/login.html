<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Distributed WebSocket Chat</title><link rel="stylesheet" href="assets/css/demo.css"></head><body>
<div class="login-page">
<div class="login-box">
  <div class="login-logo">Distributed WebSocket Chat</div>
  <div class="login-desc">登录或注册账号以进入演示系统</div>

  <label for="u">用户名</label>
  <input id="u" type="text" placeholder="user001" autofocus>

  <label for="p">密码</label>
  <input id="p" type="password" placeholder="123456">

  <div class="err" id="err"></div>

  <div class="login-btns">
    <button id="btnLogin" class="btn-primary" onclick="doLogin()">登 录</button>
    <button id="btnRegister" class="btn-secondary" onclick="doRegister()">注 册</button>
  </div>

  <p class="info">
    测试账号：<code>user001 / 123456</code> &nbsp; <code>user002 / 654321</code><br>
    WebSocket：<span id="wsLabel"></span>
  </p>
</div>
</div>
<script src="assets/js/config.js"></script><script src="assets/js/protocol.js"></script><script src="assets/js/state.js"></script><script src="assets/js/ws-client.js"></script><script src="assets/js/ui.js"></script>
<script>
var cl = null,
    _err = document.getElementById('err'),
    _btnL = document.getElementById('btnLogin'),
    _btnR = document.getElementById('btnRegister');

document.getElementById('wsLabel').textContent = DemoConfig.WS_URL;

function setStatus(text, type) {
  _err.textContent = text;
  if (type === 'ok') _err.style.color = '#10b981';
  else if (type === 'error') _err.style.color = '#ef4444';
  else _err.style.color = '#a0a0a8'; // info
}

function setBusy(busy) {
  _btnL.disabled = busy;
  _btnR.disabled = busy;
}

function initCl() {
  if (cl) cl.close();
  cl = new WsClient(DemoConfig.WS_URL);
  window.__client = cl;
  cl.onMsg = onMsg;
  cl.onLogin = onLogin;
}

function onMsg(m) {
  if (m.msg_type === 'register' && m.code === 200) {
    setStatus('注册成功，可以登录', 'ok');
    setBusy(false);
  }
  if (m.msg_type === 'error') {
    setStatus((m.code || '') + ' ' + (m.err_msg || ''), 'error');
    setBusy(false);
  }
}

function onLogin(user, token) {
  State.user(user); State.token(token);
  State.pwd(document.getElementById('p').value);
  cl.close();
  window.location.href = 'app.html';
}

function ensure() {
  if (cl && cl.connected) return Promise.resolve();
  initCl();
  return cl.connect();
}

function doRegister() {
  var u = document.getElementById('u').value.trim();
  var p = document.getElementById('p').value;
  if (!u || !p) { setStatus('请输入用户名和密码', 'error'); return; }

  setStatus('正在连接服务器...', 'info');
  setBusy(true);

  ensure()
    .then(function() {
      setStatus('正在注册...', 'info');
      cl.register(u, p);
    })
    .catch(function() {
      setStatus('无法连接 WebSocket 服务，请检查 WS 地址或后端是否启动', 'error');
      setBusy(false);
    });
}

function doLogin() {
  var u = document.getElementById('u').value.trim();
  var p = document.getElementById('p').value;
  if (!u || !p) { setStatus('请输入用户名和密码', 'error'); return; }

  setStatus('正在连接服务器...', 'info');
  setBusy(true);

  ensure()
    .then(function() {
      setStatus('正在登录...', 'info');
      cl.login(u, p);
    })
    .catch(function() {
      setStatus('无法连接 WebSocket 服务，请检查 WS 地址或后端是否启动', 'error');
      setBusy(false);
    });
}

// Enter key support
document.getElementById('u').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('p').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});

initCl();
</script></body></html>
