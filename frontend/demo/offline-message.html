<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>离线消息 — Demo</title><link rel="stylesheet" href="assets/css/demo.css"></head><body>
<a href="index.html" style="padding:6px 12px;font-size:12px;color:#60a5fa;text-decoration:none;display:block;">← Back</a>
<div class="lay">
<div class="main">
<div class="bar">
    <span class="conn-status off" id="st">○ Disconnected</span> <span id="bd">-</span> <span id="tg">Target: none</span>
    <span id="hint" style="color:#facc15;font-size:11px;margin-left:8px;">Step 1: Login as receiver, then disconnect</span>
    <button onclick="OfflinePage.disconnect()" style="margin-left:auto;padding:4px 10px;border:none;border-radius:4px;background:#f59e0b;color:#fff;cursor:pointer;font-size:11px;">Disconnect</button>
    <button onclick="OfflinePage.reconnectAndLogin()" style="padding:4px 10px;border:none;border-radius:4px;background:#7c3aed;color:#fff;cursor:pointer;font-size:11px;">Reconnect &amp; Login</button>
    <button onclick="OfflinePage.logout()" style="padding:4px 10px;border:none;border-radius:4px;background:#dc2626;color:#fff;cursor:pointer;font-size:11px;">Logout</button>
</div>
<div class="bar" style="flex-wrap:wrap;">
    <input id="u" placeholder="User" value="user001" style="width:100px"><input id="p" type="password" placeholder="Pass" value="123456" style="width:80px">
    <button onclick="OfflinePage.login()" style="padding:4px 10px;border:none;border-radius:4px;background:#7c3aed;color:#fff;cursor:pointer;font-size:11px;">Login</button>
    <input id="tu" placeholder="Target user" value="user002" style="width:100px"><button onclick="OfflinePage.startChat()" style="padding:4px 10px;border:none;border-radius:4px;background:#2563eb;color:#fff;cursor:pointer;font-size:11px;">Start Chat</button>
</div>
<div class="chat" id="chat"></div>
<div class="inp"><input id="ci" placeholder="Message (goes to offline user)..."><button onclick="OfflinePage.sendMsg()">Send</button></div>
</div>
<div class="side"><div class="ph">Protocol</div><div class="pl" id="pl"></div></div>
</div>
<script src="assets/js/config.js"></script><script src="assets/js/protocol.js"></script><script src="assets/js/state.js"></script><script src="assets/js/ws-client.js"></script><script src="assets/js/ui.js"></script>
<script src="assets/js/pages/offline-message-page.js"></script>
<script>OfflinePage.init();</script>
</body></html>
