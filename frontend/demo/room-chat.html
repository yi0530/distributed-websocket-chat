<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>群聊 — Demo</title><link rel="stylesheet" href="assets/css/demo.css"></head><body><div class="back"><a href="index.html">← Back</a></div>
<div class="lay">
<div class="main">
<div class="bar">
    <span class="conn-status off" id="st">○ Disconnected</span>
    <span id="bd">-</span>
    <span id="rm">No room</span>
    <button onclick="O()" class="red" style="margin-left:auto">Logout</button>
</div>
<div class="bar">
    <input id="u" placeholder="User" value="user001" style="width:100px">
    <input id="p" type="password" placeholder="Pass" value="123456" style="width:80px">
    <button onclick="L()" class="purple">Login</button>
    <input id="rn" placeholder="Room name" style="width:100px">
    <button onclick="CR()">Create</button>
    <input id="rj" placeholder="Room ID" style="width:160px">
    <button onclick="JR()">Join</button>
</div>
<div class="chat" id="chat"></div>
<div class="inp"><input id="ci" placeholder="Message..."><button onclick="SC()">Send</button></div>
</div>
<div class="side"><div class="ph">Protocol</div><div class="pl" id="pl"></div></div>
</div>
<script src="assets/js/config.js"></script><script src="assets/js/protocol.js"></script><script src="assets/js/state.js"></script><script src="assets/js/ws-client.js"></script><script src="assets/js/ui.js"></script>
<script>
var cl=null, room=null, _c=document.getElementById('chat'), _p=document.getElementById('pl');
function init(){if(cl)cl.close();cl=new WsClient(DemoConfig.WS_URL);window.__client=cl;cl.onLog=function(e){U.proto(_p,e)};cl.onState=function(s){U.conn(document.getElementById('st'),s==='connected')};cl.onMsg=onMsg;cl.onAck=function(id,st,rtt){U.sys(_c,'ACK '+st+' rtt='+(rtt||'?')+'ms')};}
function onMsg(m){
    var mt=m.msg_type;
    if(mt==='login'&&m.code===200){State.user(m.from||(m.content&&m.content.username)||'');State.token((m.content&&m.content.token)||'');U.badge(document.getElementById('bd'),State.user());U.sys(_c,'Login: '+State.user())}
    if(mt==='room_created'&&m.code===200){room=m.content.conversation_id;State.room(room);U.sys(_c,'Room created: '+room.slice(0,12));document.getElementById('rm').textContent='Room: '+room.slice(0,12)}
    if(mt==='room_joined'&&m.code===200){room=m.content.conversation_id;State.room(room);U.sys(_c,'Joined: '+room.slice(0,12));document.getElementById('rm').textContent='Room: '+room.slice(0,12)}
    if(mt==='room_chat'){var own=(m.content&&m.content.from_user_id)===State.user();U.msg(_c,m.content,own)}
    if(mt==='error')U.sys(_c,'Error: '+(m.err_msg||''))
}
function ensure(){if(cl&&cl.connected)return Promise.resolve();init();return cl.connect()}
function L(){ensure().then(function(){cl.login(document.getElementById('u').value.trim(),document.getElementById('p').value)})}
function CR(){ensure().then(function(){cl.createRoom(document.getElementById('rn').value.trim()||'Room')})}
function JR(){ensure().then(function(){cl.joinRoom(document.getElementById('rj').value.trim())})}
function SC(){if(!room)return;var t=document.getElementById('ci').value.trim();if(!t)return;ensure().then(function(){cl.sendRoomMsg(room,t,true)});document.getElementById('ci').value=''}
function O(){State.logout();room=null;if(cl)cl.close();cl=null;U.clear(_c);U.clear(_p);U.badge(document.getElementById('bd'),'');U.conn(document.getElementById('st'),false);document.getElementById('rm').textContent='No room'}
init();
</script></body></html>
