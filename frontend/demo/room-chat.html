<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>群聊 — Demo</title><link rel="stylesheet" href="assets/css/demo.css"></head><body>
<a href="index.html" style="padding:6px 12px;font-size:12px;color:#60a5fa;text-decoration:none;display:block;">← Back</a>
<div class="lay">
<div class="main">
<div class="bar"><span class="conn-status off" id="st">○ Disconnected</span> <span id="bd">-</span> <span id="rm">No room</span> <button onclick="RoomChatPage.logout()" style="background:#dc2626;margin-left:auto;padding:4px 10px;border:none;border-radius:4px;color:#fff;cursor:pointer;font-size:11px;">Logout</button></div>
<div class="bar" style="flex-wrap:wrap;">
    <input id="u" placeholder="User" value="user001" style="width:100px"><input id="p" type="password" placeholder="Pass" value="123456" style="width:80px">
    <button onclick="RoomChatPage.login()" style="padding:4px 10px;border:none;border-radius:4px;background:#7c3aed;color:#fff;cursor:pointer;font-size:11px;">Login</button>
    <input id="rn" placeholder="Room name" style="width:100px"><button onclick="RoomChatPage.createRoom()" style="padding:4px 10px;border:none;border-radius:4px;background:#2563eb;color:#fff;cursor:pointer;font-size:11px;">Create</button>
    <input id="rj" placeholder="Room ID" style="width:160px"><button onclick="RoomChatPage.joinRoom()" style="padding:4px 10px;border:none;border-radius:4px;background:#2563eb;color:#fff;cursor:pointer;font-size:11px;">Join</button>
</div>
<div class="chat" id="chat"></div>
<div class="inp"><input id="ci" placeholder="Message..."><button onclick="RoomChatPage.sendChat()">Send</button></div>
</div>
<div class="side"><div class="ph">Protocol</div><div class="pl" id="pl"></div></div>
</div>
<script src="assets/js/config.js"></script><script src="assets/js/protocol.js"></script><script src="assets/js/state.js"></script><script src="assets/js/ws-client.js"></script><script src="assets/js/ui.js"></script>
<script src="assets/js/pages/room-chat-page.js"></script>
<script>RoomChatPage.init();</script>
</body></html>
