<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat App — Distributed WebSocket Chat</title><link rel="stylesheet" href="assets/css/demo.css"></head><body>
<div class="app">

<!-- Left Sidebar -->
<nav class="app-nav">
  <div class="nav-header">Chat Demo</div>
  <div class="nav-section">功能模块</div>
  <div class="nav-item active" data-mod="room" onclick="AppPage.switchMod('room')">
    <span>#</span> 群聊
  </div>
  <div class="nav-item" data-mod="private" onclick="AppPage.switchMod('private')">
    <span>@</span> 私聊
  </div>
  <div class="nav-spacer"></div>

  <div class="nav-bottom">
    <button onclick="openSecondWindow()">+ 打开第二窗口</button>
  </div>
</nav>

<!-- Main Body -->
<div class="app-body">
  <div class="app-top">
    <span class="top-user" id="topUser">-</span>
    <span class="top-conn" id="topConn">正在连接...</span>
    <span class="top-auth muted" id="topAuth">等待连接</span>
    <span class="top-token" id="topToken"></span>
    <span class="top-actions">
      <button onclick="togglePanel()" title="切换协议面板">协议面板</button>
      <button class="danger" onclick="doLogout()">退出登录</button>
    </span>
  </div>
  <div id="modArea" style="position:relative"></div>
</div>

<!-- Right Protocol Panel -->
<div class="app-panel" id="sidePanel">
  <div class="panel-head">
    <span>Protocol</span>
    <button onclick="togglePanel()" title="折叠面板">&times;</button>
  </div>
  <div class="panel-body" id="protoPanel"></div>
</div>

</div>

<script src="assets/js/config.js"></script><script src="assets/js/protocol.js"></script><script src="assets/js/state.js"></script><script src="assets/js/ws-client.js"></script><script src="assets/js/ui.js"></script>
<script src="assets/js/modules/room-module.js"></script>
<script src="assets/js/modules/private-module.js"></script>
<script>
var _authTimer = null;

function setConnStatus(text, cls) {
  var el = document.getElementById('topConn');
  if (!el) return;
  el.textContent = text;
  el.className = 'top-conn ' + (cls || 'muted');
}
function setAuthStatus(text, cls) {
  var el = document.getElementById('topAuth');
  if (!el) return;
  el.textContent = text;
  el.className = 'top-auth ' + (cls || 'muted');
}

var AppPage = {
    cl: null, mod: 'room', _p: null, _panel: null, appReady: false,

    init: function() {
        if (!State.loggedIn()) { window.location.href = 'login.html'; return; }
        this._p = document.getElementById('protoPanel');
        this._panel = document.getElementById('sidePanel');
        document.getElementById('topUser').textContent = State.user();
        document.getElementById('topToken').textContent = 'Token: ' + (State.token() || '').slice(0, 16) + '...';
        this._conn();
        this.switchMod(this.mod);
    },

    _conn: function() {
        var self = this;
        clearTimeout(_authTimer);
        self.appReady = false;
        if (this.cl) this.cl.close();

        setConnStatus('正在连接...', 'muted');
        setAuthStatus('等待连接', 'muted');

        this.cl = new WsClient(DemoConfig.WS_URL);
        window.__client = this.cl;

        this.cl.onLog = function(e) { U.proto(self._p, e); };

        this.cl.onState = function(s) {
            if (s === 'connected') {
                setConnStatus('● 已连接', 'top-ok');
            } else if (s === 'error') {
                setConnStatus('连接失败', 'top-off');
            } else if (s === 'disconnected') {
                setConnStatus('○ 未连接', 'top-off');
            } else {
                setConnStatus(s, 'muted');
            }
        };

        // ---- Unified message dispatch (by msg_type, not current page) ----
        this.cl.onMsg = function(m) {
            var mt = m.msg_type;

            // Auth-phase error
            if (mt === 'error' && !self.appReady) {
                setAuthStatus('登录失败：' + (m.err_msg || ''), 'top-off');
                clearTimeout(_authTimer);
                showAuthFailure('登录失败：' + (m.err_msg || ''));
                return;
            }

            // Room messages — always route to RoomMod
            if (mt === 'room_created' || mt === 'room_joined' || mt === 'room_chat' || mt === 'room_members' || mt === 'leave_room') {
                if (RoomMod.handleMsg) RoomMod.handleMsg(m);
                return;
            }

            // Private messages — always route to PrivMod
            if (mt === 'private_conversation_created' || mt === 'private_chat') {
                if (PrivMod.handleMsg) PrivMod.handleMsg(m);
                return;
            }

            // Error while authenticated — route by msg_id prefix
            if (mt === 'error' && self.appReady) {
                var mid = m.msg_id || '';
                if (mid.indexOf('cr-') === 0 || mid.indexOf('join-') === 0 || mid.indexOf('chat-') === 0) {
                    if (RoomMod.handleMsg) RoomMod.handleMsg(m);
                } else if (mid.indexOf('cpc-') === 0 || mid.indexOf('priv-') === 0) {
                    if (PrivMod.handleMsg) PrivMod.handleMsg(m);
                } else {
                    // Unknown origin — show in both as system message
                    if (RoomMod.handleMsg) RoomMod.handleMsg(m);
                }
                return;
            }
        };

        // ---- Unified ACK dispatch (by msg_id prefix) ----
        this.cl.onAck = function(msgId, status, rtt) {
            if (msgId.indexOf('chat-') === 0) {
                if (RoomMod.handleAck) RoomMod.handleAck(msgId, status, rtt);
            } else if (msgId.indexOf('priv-') === 0) {
                if (PrivMod.handleAck) PrivMod.handleAck(msgId, status, rtt);
            }
        };

        this.cl.onLogin = function(user, token) {
            clearTimeout(_authTimer);
            State.user(user);
            State.token(token);
            document.getElementById('topUser').textContent = user;
            document.getElementById('topToken').textContent = 'Token: ' + token.slice(0, 16) + '...';
            self.appReady = true;
            setAuthStatus('已认证', 'top-ok');
            // Re-render current module now that we're ready
            self._renderMod();
        };

        this.cl.connect()
            .then(function() {
                setAuthStatus('自动登录中...', 'muted');
                var u = State.user(), p = State.pwd();
                if (u && p) {
                    self.cl.login(u, p);
                    var timeout = DemoConfig.LOGIN_TIMEOUT_MS || 8000;
                    _authTimer = setTimeout(function() {
                        setAuthStatus('自动登录响应超时', 'top-off');
                        showAuthFailure('自动登录响应超时');
                    }, timeout);
                } else {
                    setAuthStatus('无登录凭据', 'top-off');
                    showAuthFailure('无登录凭据，请重新登录');
                }
            })
            .catch(function(err) {
                setConnStatus('连接失败', 'top-off');
                setAuthStatus('无法自动登录', 'top-off');
                var msg = (err && err.message && err.message.indexOf('timeout') >= 0)
                    ? 'connect timeout' : 'WebSocket error';
                U.proto(self._p, { id: 0, time: new Date().toISOString().slice(11,23), dir: 'ERROR', type: 'connect', summary: msg });
                showAuthFailure('无法连接后端服务');
            });
    },

    _renderMod: function() {
        var area = document.getElementById('modArea');
        if (!area) return;
        area.innerHTML = '';
        if (this.mod === 'room') RoomMod.render(area, this.cl);
        else if (this.mod === 'private') PrivMod.render(area, this.cl);
    },

    switchMod: function(m) {
        this.mod = m;
        document.querySelectorAll('.nav-item').forEach(function(el) {
            el.classList.toggle('active', el.dataset.mod === m);
        });
        this._renderMod();
    }
};

function showAuthFailure(msg) {
  var area = document.getElementById('modArea');
  if (!area) return;
  area.innerHTML =
    '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;color:#a0a0a8;font-size:15px">' +
    '<p>' + msg + '</p>' +
    '<p>当前连接未认证，聊天功能暂不可用</p>' +
    '<button onclick="doLogout()" style="padding:10px 24px;border:1px solid #ef4444;border-radius:8px;background:transparent;color:#ef4444;cursor:pointer;font-size:14px">返回登录页</button>' +
    '</div>';
}

function togglePanel() {
    var p = document.getElementById('sidePanel');
    if (p) p.classList.toggle('collapsed');
}

function openSecondWindow() {
    window.open('index.html?ws=' + encodeURIComponent(DemoConfig.WS_URL) + '&fresh=1', '_blank', 'noopener,noreferrer');
}

function doLogout() {
    clearTimeout(_authTimer);
    State.logout();
    if (AppPage.cl) AppPage.cl.close();
    window.location.href = 'login.html';
}

AppPage.init();
</script></body></html>
